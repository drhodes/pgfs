[package]
name = "pgfs"
version = "0.2.0"
edition = "2021"

[lib]
name = "pgfs"
path = "src/lib.rs"

[[bin]]
name = "pgfs"
path = "src/main.rs"

[profile.release]
panic = "abort"

[features]
profiling = ["pprof", "tracing-chrome"]
# Wrap the database layer so tests can fail the Nth call with any error
# class of spec/failure.py MapsDatabaseErrors (spec/verify.py DbFaultInjection).
fault-injection = []

[dependencies]
fuser = { version = "0.14", features = ["abi-7-31"] }

tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
futures-util = "0.3"
libc = "0.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
crc32c = "0.6"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
tracing-chrome = { version = "0.7", optional = true }

[dev-dependencies]
proptest = "1"
